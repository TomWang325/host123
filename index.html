<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图床 & 反馈系统</title>
<!-- ✅ 修复 CSS 路径 -->
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>图床 & 反馈系统</h1>
    <p>基于腾讯云COS + GitHub Pages</p >
    <div class="user-info">
      <span id="headerUsername"></span>
      <span id="headerRole"></span>
      <a href=" " id="changePwdLink">修改密码</a >
      <a href="javascript:void(0)" class="logout-link" id="logoutBtn">退出登录</a >
    </div>
    <div class="notification-icon" id="notificationIcon">
      🔔
      <span class="unread-badge" id="unreadBadge">0</span>
    </div>
  </div>

  <div id="cosConfigBanner" class="cos-config-banner">
    COS未配置，点此 <a href="javascript:void(0)" id="cosSetupLink">设置</a >
  </div>

  <div id="navTabs" class="nav-tabs"></div>

  <!-- 登录页 -->
  <div id="page-login" class="page-view">
    <div class="login-page">
      <div class="auth-card">
        <h1>登录</h1>
        <div class="auth-sub">欢迎使用图床系统</div>
        <div id="loginError" class="error-msg" style="display:none;"></div>
        <form id="loginForm">
          <div class="input-group">
            <label>用户名</label>
            <input type="text" id="loginUsername" autocomplete="username">
          </div>
          <div class="input-group">
            <label>密码</label>
            <input type="password" id="loginPassword" autocomplete="current-password">
          </div>
          <button type="submit" class="auth-btn">登录</button>
        </form>
        <div class="auth-footer">
          没有账号？<a id="toRegisterLink">立即注册</a >
        </div>
      </div>
    </div>
  </div>

  <!-- 注册页 -->
  <div id="page-register" class="page-view">
    <div class="login-page">
      <div class="auth-card">
        <h1>注册</h1>
        <div id="regError" class="error-msg" style="display:none;"></div>
        <form id="regForm">
          <div class="input-group">
            <label>用户名</label>
            <input type="text" id="regUsername" autocomplete="username">
          </div>
          <div class="input-group">
            <label>密码</label>
            <input type="password" id="regPassword" autocomplete="new-password">
          </div>
          <button type="submit" class="auth-btn">注册</button>
        </form>
        <div class="auth-footer">
          已有账号？<a id="toLoginLink">立即登录</a >
        </div>
      </div>
    </div>
  </div>

  <!-- 主页面（反馈） -->
  <div id="page-main" class="page-view">
    <div class="feedback-card">
      <div class="feedback-form-title">提交反馈</div>
      <textarea class="feedback-textarea" id="feedbackContent" placeholder="请输入反馈内容..."></textarea>
      <div class="image-select-area">
        <div class="drawer-header" id="drawerHeader">
          <div class="drawer-header-left">
            <span class="drawer-arrow" id="drawerArrow">▶</span>
            <span class="image-select-label">选择已有图片</span>
            <span class="selected-hint" id="selectedHint"></span>
          </div>
        </div>
        <div class="drawer-content" id="drawerContent">
          <div class="existing-images" id="existingImagesList"></div>
          <div class="upload-new-area">
            <span>上传新图片：</span>
            <button class="upload-new-btn" id="uploadForFeedbackBtn">选择图片</button>
            <input type="file" id="feedbackFileInput" accept="image/*" style="display:none;">
            <span id="uploadProgress"></span>
          </div>
        </div>
      </div>
      <button class="submit-feedback-btn" id="submitFeedbackBtn">提交反馈</button>
    </div>

    <div class="filter-bar">
      <div class="filter-label">按用户筛选：</div>
      <div class="filter-buttons" id="filterButtons"></div>
      <div class="filter-label" style="margin-left:20px;">状态：</div>
      <div class="filter-buttons" id="statusFilterButtons"></div>
      <div class="admin-view-toggle" id="adminViewArea" style="display:none;">
        <label><input type="checkbox" id="adminViewToggle"> 管理员查看全部</label>
      </div>
    </div>

    <div class="feedback-list" id="feedbackList"></div>
  </div>

  <!-- 图床管理 -->
  <div id="page-gallery" class="page-view">
    <div class="toolbar">
      <div class="stats" id="statsInfo">0 张图片</div>
      <div class="actions">
        <button class="refresh-btn" id="refreshGalleryBtn">刷新</button>
        <button class="select-all-btn" id="selectAllBtn">全选/取消</button>
        <button class="copy-selected-btn" id="copySelectedBtn">复制选中链接</button>
        <button class="upload-new-btn" id="galleryUploadBtn">上传图片</button>
        <input type="file" id="galleryFileInput" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="gallery-grid" id="galleryContainer"></div>
  </div>

  <!-- 消息面板 -->
  <div class="notification-panel" id="notificationPanel">
    <div class="notification-header">
      <div class="notification-title">消息中心</div>
      <div class="notification-actions">
        <button class="notification-action-btn" id="markAllReadBtn">全部已读</button>
        <button class="notification-action-btn" id="deleteAllReadBtn">删除已读</button>
      </div>
    </div>
    <div class="notification-list" id="notificationList"></div>
  </div>

  <!-- 图片预览模态框 -->
  <div class="modal" id="imageModal">
    <span class="close-modal" id="closeModalBtn">&times;</span>
    <div class="modal-content">
      < img class="modal-img" id="modalImg">
    </div>
  </div>

  <!-- 用户管理面板 -->
  <div class="user-panel-overlay" id="userPanelOverlay">
    <div class="user-panel">
      <button class="user-panel-close" id="closeUserPanelBtn">&times;</button>
      <h2>用户列表</h2>
      <div id="userPanelBody"></div>
    </div>
  </div>

  <!-- 修改密码面板 -->
  <div class="user-panel-overlay" id="pwdPanelOverlay">
    <div class="user-panel">
      <button class="user-panel-close" id="closePwdPanelBtn">&times;</button>
      <h2>修改密码</h2>
      <div id="pwdError" class="error-msg" style="display:none;"></div>
      <div class="input-group">
        <label>当前密码</label>
        <input type="password" id="oldPassword">
      </div>
      <div class="input-group">
        <label>新密码</label>
        <input type="password" id="newPassword1">
      </div>
      <div class="input-group">
        <label>确认新密码</label>
        <input type="password" id="newPassword2">
      </div>
      <button class="auth-btn" id="changePwdBtn">确认修改</button>
    </div>
  </div>

  <!-- COS配置面板 -->
  <div class="user-panel-overlay" id="cosSetupOverlay">
    <div class="user-panel">
      <button class="user-panel-close" id="closeCosSetupBtn">&times;</button>
      <h2>COS存储配置</h2>
      <div id="cosSetupError" class="error-msg" style="display:none;"></div>
      <div class="input-group">
        <label>SecretId</label>
        <input type="text" id="cosSetupId">
      </div>
      <div class="input-group">
        <label>SecretKey</label>
        <input type="password" id="cosSetupKey">
      </div>
      <div class="input-group">
        <label>存储桶名称(含APPID)</label>
        <input type="text" id="cosSetupBucket">
      </div>
      <div class="input-group">
        <label>地域</label>
        <input type="text" id="cosSetupRegion" placeholder="例如 ap-beijing">
      </div>
      <button class="auth-btn" id="cosSetupSaveBtn">保存配置</button>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
